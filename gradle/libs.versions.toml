[versions]
agp = "9.3.1"
coreKtx = "1.19.0"
junit = "4.13.2"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.10"
composeBom = "2026.08.00"
media3 = "1.11.0"
coil = "2.7.0"
palette = "1.0.0"
navigationCompose = "2.9.8"
room = "2.8.4"
ksp = "2.3.11"
coroutinesTest = "1.11.0"
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
okhttp = "5.4.0"
serialization = "1.11.0"
datastore = "1.1.7"
ktlintPlugin = "14.2.0"
ktlint = "1.8.0"
detekt = "1.23.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Navigation Compose — onglets Titres / Albums / Artistes + écrans de détail
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Room — playlists locales (données qui n'existent pas dans le MediaStore)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Tests JVM — Robolectric fournit un vrai android.net.Uri et un SQLite pour Room,
# ce qui évite d'avoir besoin d'un émulateur.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

# Media3 / ExoPlayer — moteur audio, session, contrôles lockscreen/notif
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

# Cache de lecture : arrivaient déjà par l'exoplayer, déclarés parce qu'on s'en
# sert directement (SimpleCache, CacheDataSource, StandaloneDatabaseProvider).
androidx-media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
androidx-media3-database = { group = "androidx.media3", name = "media3-database", version.ref = "media3" }

# Coil — chargement des pochettes
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Palette — couleur dominante extraite de la pochette (fond du lecteur)
androidx-palette = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }

# Serveur WaveFlow — OkHttp arrivait déjà par Coil, déclaré ici parce qu'on
# s'en sert directement. `mockwebserver` sert les tests du client HTTP.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# DataStore — jetons de session, hors de Room : ce n'est pas de la donnée
# relationnelle et ça ne doit pas voyager avec les sauvegardes de playlists.
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Formatage et style Kotlin — l'équivalent d'un prettier. Le plugin et
# l'outil qu'il exécute versionnent séparément : `ktlint` fixe le second,
# sinon le style changerait au gré des mises à jour du premier.
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }

# Analyse statique — l'équivalent d'un eslint : complexité, pièges de
# construction, code mort. Distinct de ktlint, qui ne juge que la forme.
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

